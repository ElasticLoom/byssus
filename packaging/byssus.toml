# /etc/byssus/byssus.toml — main Byssus configuration.
#
# Must stay owned by root and not group- or world-writable. Define groups in
# drop-in files under /etc/byssus/conf.d/ (one per tenant or purpose works
# well), then check with `sudo byssus check` or `sudo byssus dry-run` and
# reload with `sudo systemctl reload byssusd`.
#
# Reference: /usr/share/doc/byssus/REFERENCE.md
# Example group: /usr/share/doc/byssus/examples/conf.d/research.toml
# Example group set (groups created at runtime as directories):
#   /usr/share/doc/byssus/examples/conf.d/projects.toml

[daemon]
# The service user. `byssusd` switches to it when started as root (the packaged
# systemd unit starts it as this user directly), and `byssus check` and
# `byssus dry-run` run as root check access as this user, so their results
# match what the daemon will see.
user = "byssus"

# State file and lock location (the systemd unit creates this directory).
# state_dir = "/var/lib/byssus"

# Full reconcile interval in seconds; 0 disables.
# resync_interval_secs = 60
